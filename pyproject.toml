[project]
name = "fomo-challenge-metrics"
version = "0.1.0"
description = "Metric functions for the FOMO26 Challenge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Pablo Rocamora-García", email = "paga@di.ku.dk" },
]
keywords = ["metrics", "medical imaging", "segmentation", "classification", "FOMO26"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy",
    "scikit-learn",
    "scipy",
    "surface-distance",
    "pydantic>=2",
]

[project.urls]
Repository = "https://github.com/fomo26/fomo-metrics"
Homepage = "https://github.com/fomo26/fomo-metrics"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
