[project]
name = "fomo-challenge-metrics"
version = "0.1.0"
description = "Metric functions for the FOMO26 Challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scikit-learn",
    "scipy",
    "surface-distance",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
